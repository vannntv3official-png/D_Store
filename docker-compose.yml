services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dstore_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=dstore
      - DB_USERNAME=dstore_user
      - DB_PASSWORD=dstore_secret
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit
      - MAIL_PORT=1025
    depends_on:
      - db
      - redis
      - mailpit

  web:
    image: nginx:alpine
    container_name: dstore_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: dstore_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: dstore
      MYSQL_USER: dstore_user
      MYSQL_PASSWORD: dstore_secret
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: dstore_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: dstore_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
  redis_data:
